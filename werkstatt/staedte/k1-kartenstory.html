<title>Ist Küsnacht eine Stadt?</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
:root{--text:#2B2727;--blau:#171782;--rot:#C0392B;--hell:#D9D6EE;--grau:#8a8686}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Open Sans',system-ui,sans-serif;color:var(--text);background:#111}
#karte{position:absolute;inset:0}
#tafel{position:absolute;left:2.2vw;top:2.2vw;max-height:calc(100% - 7.4vw);width:min(36vw,620px);background:rgba(255,255,255,.96);border-radius:6px;padding:2.4vw 2.4vw 1.6vw;display:flex;flex-direction:column;overflow:auto;box-shadow:0 2px 18px rgba(0,0,0,.25);transition:background .4s,color .4s}
#tafel.blau{background:var(--blau);color:var(--hell)}
#tafel h1{font-size:clamp(26px,2.6vw,46px);line-height:1.15;font-weight:600;margin:0 0 .6em}
#tafel p{font-size:clamp(16px,1.35vw,24px);line-height:1.45;margin:0 0 .7em}
#tafel .frage{font-weight:600;color:var(--blau)}
#tafel.blau .frage{color:#fff}
#tafel table{border-collapse:collapse;font-size:clamp(14px,1.15vw,20px);margin:.3em 0 .8em;width:100%}
#tafel td,#tafel th{padding:.28em .4em;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
#tafel th{font-weight:600}
#tafel td.z{text-align:right;font-variant-numeric:tabular-nums}
#tafel .ja{color:var(--blau);font-weight:700}
#tafel .nein{color:var(--rot);font-weight:700}
#legende{padding-top:.4em;font-size:clamp(13px,1vw,17px)}
.lz{display:flex;align-items:center;gap:.5em;margin:.2em 0}
.lk{width:1.1em;height:1.1em;border-radius:2px;flex:none}
.lp{width:.9em;height:.9em;border-radius:50%;flex:none}
.skala{display:flex;height:.9em;border-radius:2px;overflow:hidden;margin:.25em 0}
.skala span{flex:1}
.skalatext{display:flex;justify-content:space-between;color:var(--grau)}
#leiste{position:absolute;left:2.2vw;right:2.2vw;bottom:1.4vw;height:2.4vw;display:flex;align-items:center;gap:.6vw}
#leiste button{font:inherit;font-size:clamp(14px,1.1vw,18px);background:rgba(255,255,255,.92);border:0;border-radius:4px;padding:.3em .9em;cursor:pointer;color:var(--text)}
#punkte{display:flex;gap:.4vw;flex:1;justify-content:center}
#punkte i{width:.75vw;height:.75vw;min-width:9px;min-height:9px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}
#punkte i.an{background:#fff}
.mapboxgl-popup-content{font-family:'Open Sans',system-ui,sans-serif;font-size:15px;color:var(--text);padding:.6em .8em}
.mapboxgl-popup-content b{font-weight:600}
svg.hantel text{font-family:'Open Sans',system-ui,sans-serif}
</style>
</head>
<body>
<div id="karte"></div>
<div id="tafel"></div>
<div id="leiste"><button id="zurueck">←</button><div id="punkte"></div><button id="weiter">→</button></div>

function skala(von,bis,einheit){return `<div class="skala">${SEQ.map(c=>`<span style="background:${c}"></span>`).join('')}</div><div class="skalatext"><span>${von}</span><span>${bis}${einheit||''}</span></div>`}
function stufen(feld,grenzen){ // step-Ausdruck mit 6 Klassen
  const e=['step',['coalesce',['get',feld],-1],'#cfcfcf',0,SEQ[0]];
  grenzen.forEach((g,i)=>e.push(g,SEQ[i+1])); return e;}

function haken(w){return w===true?'<span class="ja">✓</span>':w===false?'<span class="nein">✗</span>':'<span>?</span>'}

function hantel(L){
  const W=520,zh=30,top=26,H=top+L.length*zh+28,x0=120,x1=W-20,X=v=>x0+(x1-x0)*v/100;
  let s=`<svg class="hantel" viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,25,50,75,100].forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${top-6}" y2="${H-24}" stroke="#e3e3e3"/><text x="${X(v)}" y="${H-6}" font-size="12" text-anchor="middle" fill="#8a8686">${v} %</text>`});
  L.forEach((r,i)=>{const y=top+i*zh+zh/2;
    s+=`<text x="${x0-10}" y="${y+5}" font-size="15" text-anchor="end" fill="#2B2727">${r.l}</text>`;
    s+=`<line x1="${X(r.n)}" x2="${X(r.e)}" y1="${y}" y2="${y}" stroke="#b9b6c9" stroke-width="3"/>`;
    s+=`<circle cx="${X(r.n)}" cy="${y}" r="7" fill="${BLAU}"/><circle cx="${X(r.e)}" cy="${y}" r="7" fill="${ROT}"/>`;});
  s+=`<circle cx="${x0}" cy="10" r="6" fill="${BLAU}"/><text x="${x0+10}" y="15" font-size="13" fill="#2B2727">nationale Definition</text>`;
  s+=`<circle cx="${x0+190}" cy="10" r="6" fill="${ROT}"/><text x="${x0+200}" y="15" font-size="13" fill="#2B2727">einheitliche Methode der UNO</text>`;
  return s+'</svg>';
}

 {html:`<h1>Und dein Wohnort?</h1><table><tr><th></th><th>Zürich</th><th>Küsnacht</th><th>Regensberg</th><th>Wohnort</th></tr>
  <tr><td>statistisch</td><td>${haken(true)}</td><td>${haken(true)}</td><td>${haken(false)}</td><td></td></tr>
  <tr><td>rechtlich-historisch</td><td>${haken(true)}</td><td>${haken(false)}</td><td>${haken(true)}</td><td></td></tr>
  <tr><td>formal</td><td>${haken(true)}</td><td>${haken(true)}</td><td>${haken(false)}</td><td></td></tr>
  <tr><td>funktional</td><td>${haken(true)}</td><td>${haken(false)}</td><td>${haken(false)}</td><td></td></tr>
  <tr><td>sozial</td><td>${haken(true)}</td><td>?</td><td>${haken(false)}</td><td></td></tr></table>
  <p>Eine Stadt ist keine Tatsache, sondern eine Definition. Jede misst etwas anderes.</p>`,
  cam:{center:[8.62,47.33],zoom:10.3,pitch:40,bearing:-20},sat:true}
];
function steck(n){const o=ORTE[n];return `<table><tr><td>Einwohner:innen</td><td class="z">${o.e}</td></tr><tr><td>pro km²</td><td class="z">${o.d}</td></tr><tr><td>Arbeitsplätze pro 100 Einw.</td><td class="z">${o.ap}</td></tr><tr><td>Siedlungsfläche</td><td class="z">${o.sf}</td></tr></table>`}

async function entpacke(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(st).text());
}

mapboxgl.accessToken=TOKEN;
const map=new mapboxgl.Map({container:'karte',style:'mapbox://styles/mapbox/standard',projection:'globe',
  center:SCHRITTE[0].cam.center,zoom:SCHRITTE[0].cam.zoom,pitch:SCHRITTE[0].cam.pitch,bearing:SCHRITTE[0].cam.bearing,
  language:'de',attributionControl:true,preserveDrawingBuffer:true,config:{basemap:{lightPreset:'day',showPointOfInterestLabels:false,showTransitLabels:false,showRoadLabels:false,showPedestrianRoads:false,showAdminBoundaries:false}}});
let D=null, aktuell=-1, drehAnim=null;

map.on('style.load',async()=>{
  map.addSource('mapbox-dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
  map.setTerrain({source:'mapbox-dem',exaggeration:1.2});
  D=await entpacke(DATA_B64);
  map.addSource('sat',{type:'raster',url:'mapbox://mapbox.satellite',tileSize:256});
  map.addSource('nacht',nacht); map.addSource('sieg',sieg); map.addSource('dufour',dufour);
  ['ch','zh','hist','ghsl','delta','uno'].forEach(k=>map.addSource(k,{type:'geojson',data:D[k]}));
  const ras=(id,src,op)=>map.addLayer({id,type:'raster',source:src,slot:'middle',paint:{'raster-opacity':0,'raster-opacity-transition':{duration:900},'raster-fade-duration':200,...(op||{})}});
  ras('sat','sat'); ras('nacht','nacht'); ras('sieg','sieg'); ras('dufour','dufour');
  map.addLayer({id:'ch',type:'fill',source:'ch',slot:'middle',paint:{'fill-color':['case',['==',['get','s'],1],BLAU,'#d8d6e2'],'fill-opacity':0,'fill-opacity-transition':{duration:800},'fill-outline-color':'rgba(255,255,255,.6)'}});
  map.addLayer({id:'zh',type:'fill',source:'zh',slot:'middle',paint:{'fill-color':'#ccc','fill-opacity':0,'fill-opacity-transition':{duration:800}}});
  map.addLayer({id:'zhlinie',type:'line',source:'zh',slot:'middle',paint:{'line-color':'#fff','line-width':.6,'line-opacity':0}});
  map.addLayer({id:'orte',type:'line',source:'zh',slot:'top',filter:['in',['get','n'],['literal',['Zürich','Küsnacht (ZH)','Regensberg']]],paint:{'line-color':ROT,'line-width':2.5,'line-opacity':0}});
  map.addLayer({id:'ghsl',type:'line',source:'ghsl',slot:'top',paint:{'line-color':ROT,'line-width':3,'line-opacity':0}});
  map.addLayer({id:'delta',type:'fill',source:'delta',slot:'middle',layout:{'fill-sort-key':['-',0,['get','Jahr']]},paint:{'fill-color':['match',['get','Jahr'],1975,'#f1c40f',2000,'#e67e22',ROT],'fill-opacity':0,'fill-opacity-transition':{duration:900}}});
  map.addLayer({id:'hist',type:'circle',source:'hist',slot:'top',paint:{'circle-radius':8,'circle-color':ROT,'circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':0,'circle-stroke-opacity':0}});
  map.addLayer({id:'histtext',type:'symbol',source:'hist',slot:'top',layout:{'text-field':['get','Ort'],'text-font':['Open Sans Semibold','Arial Unicode MS Bold'],'text-size':16,'text-offset':[0,1.3],'text-anchor':'top'},paint:{'text-color':'#2B2727','text-halo-color':'#fff','text-halo-width':2,'text-opacity':0}});
  map.addLayer({id:'uno',type:'circle',source:'uno',slot:'top',paint:{'circle-radius':['interpolate',['linear'],['sqrt',['get','Einw_2025']],700,4,5300,22],'circle-color':'rgba(255,255,255,.85)','circle-stroke-color':BLAU,'circle-stroke-width':2.5,'circle-opacity':0,'circle-stroke-opacity':0}});
  map.addLayer({id:'unotext',type:'symbol',source:'uno',slot:'top',layout:{'text-field':['concat',['get','Stadt_UNO'],'\n',['to-string',['/',['round',['/',['get','Einw_2025'],100000]],10]],' Mio.'],'text-font':['Open Sans Semibold','Arial Unicode MS Bold'],'text-size':15,'text-offset':[0,1.6],'text-anchor':'top'},paint:{'text-color':'#fff','text-halo-color':'rgba(0,0,0,.75)','text-halo-width':2,'text-opacity':0}});
  bauePunkte();
  const start=+(new URLSearchParams(location.search).get('s')||0);
  geh(start,true);
  if(!new URLSearchParams(location.search).has('foto')) vorladen();
  window.BEREIT=true;
});

function sicht(id,an,prop){ if(!map.getLayer(id))return; const t=map.getLayer(id).type;
  const P={raster:['raster-opacity'],fill:['fill-opacity'],line:['line-opacity'],circle:['circle-opacity','circle-stroke-opacity'],symbol:['text-opacity']}[t];
  P.forEach(p=>map.setPaintProperty(id,p,an?(prop??(t==='fill'?.82:1)):0)); }

function geh(n,sofort){
  if(!D||n<0||n>=SCHRITTE.length)return;
  const s=SCHRITTE[n]; aktuell=n;
  const t=document.getElementById('tafel'); t.className=s.blau?'blau':'';
  t.innerHTML=s.html+`<div id="legende">${s.leg||''}</div>`;
  if(s.chart) document.getElementById('hantel').innerHTML=hantel(D.laender);
  sicht('sat',!!s.sat); sicht('nacht',!!s.nacht); sicht('sieg',!!s.sieg); sicht('dufour',!!s.dufour,.9);
  sicht('ch',!!s.ch,s.dimmen?.35:.85);
  if(s.zh){map.setPaintProperty('zh','fill-color',stufen(s.zh.f,s.zh.g)); map._zhf=s.zh.f;}
  sicht('zh',!!s.zh,.85); sicht('zhlinie',!!s.zh,.8);
  sicht('orte',!!(s.zh||s.ch||s.linie)); sicht('ghsl',!!s.ghsl);
  sicht('hist',!!s.hist); sicht('histtext',!!s.hist);
  sicht('delta',!!s.delta,.55); sicht('uno',!!s.uno||!!s.delta); sicht('unotext',!!s.delta);
  try{map.setConfigProperty('basemap','lightPreset',s.licht||'day')}catch(e){}
  if(drehAnim){cancelAnimationFrame(drehAnim);drehAnim=null}
  map.stop();
  const tf=document.getElementById('tafel'); const pad={left:(tf.style.display==='none'?0:tf.offsetLeft+tf.offsetWidth),top:0,right:0,bottom:0};
  const c={...s.cam,padding:pad};
  if(sofort) map.jumpTo(c); else map.flyTo({...c,duration:s.dauer||3200,essential:true,curve:1.42});
  if(s.drehen) map.once('moveend',()=>{const b0=map.getBearing(),t0=performance.now();const f=()=>{map.setBearing(b0+(performance.now()-t0)/1000*3);drehAnim=requestAnimationFrame(f)};drehAnim=requestAnimationFrame(f)});
  document.querySelectorAll('#punkte i').forEach((p,i)=>p.classList.toggle('an',i===n));
}
function bauePunkte(){const p=document.getElementById('punkte');p.innerHTML=SCHRITTE.map((_,i)=>`<i title="${i+1}"></i>`).join('');p.querySelectorAll('i').forEach((el,i)=>el.onclick=()=>geh(i));}
document.getElementById('weiter').onclick=()=>geh(aktuell+1);
document.getElementById('zurueck').onclick=()=>geh(aktuell-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();geh(aktuell+1)}
  if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();geh(aktuell-1)}
  if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key==='p') foto();
  if(e.key==='h'){const v=document.getElementById('tafel').style.display==='none';['tafel','leiste'].forEach(id=>document.getElementById(id).style.display=v?'':'none')}
  if(e.key==='l'){const L=['day','dawn','dusk','night'];const i=(L.indexOf(map.getConfigProperty('basemap','lightPreset'))+1)%4;map.setConfigProperty('basemap','lightPreset',L[i])}
});
// Foto: Karte ohne Tafel in dreifacher Auflösung als PNG speichern
async function foto(){
  if(drehAnim){cancelAnimationFrame(drehAnim);drehAnim=null}
  const pr=map.getPixelRatio?map.getPixelRatio():devicePixelRatio;
  map.setPixelRatio(3); await new Promise(r=>map.once('idle',r));
  const a=document.createElement('a'); a.href=map.getCanvas().toDataURL('image/png');
  a.download=(shotNr>=0&&document.getElementById('tafel').style.display==='none'?SHOTS[shotNr].name+'_':`K1_Schritt${aktuell+1}_`)+`${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.png`; a.click();
  map.setPixelRatio(pr);
}
map.on('mousedown',()=>{if(drehAnim){cancelAnimationFrame(drehAnim);drehAnim=null}});


// Kamerashots für Skriptbilder: Taste k blättert, Taste p speichert
const SHOTS=[{"name": "K1_01_Zuerich_Abendlicht_ueber_den_See", "schritt": 3, "licht": "dusk", "cam": {"center": [8.538, 47.383], "zoom": 13.9, "pitch": 72, "bearing": 165}}, {"name": "K1_02_Zuerich_Morgenlicht_Altstadt", "schritt": 3, "licht": "dawn", "cam": {"center": [8.5435, 47.3715], "zoom": 15.4, "pitch": 70, "bearing": 200}}, {"name": "K1_03_Zuerich_West_Morgenlicht", "schritt": 11, "licht": "dawn", "cam": {"center": [8.5165, 47.388], "zoom": 15.6, "pitch": 70, "bearing": -55}}, {"name": "K1_04_Kuesnacht_vom_See", "schritt": 4, "cam": {"center": [8.5825, 47.316], "zoom": 14.6, "pitch": 70, "bearing": 65}}, {"name": "K1_05_Kuesnacht_Abendlicht", "schritt": 4, "sat": false, "licht": "dusk", "cam": {"center": [8.5825, 47.316], "zoom": 14.6, "pitch": 70, "bearing": 65}}, {"name": "K1_06_Regensberg_Satellit", "schritt": 5, "cam": {"center": [8.4386, 47.4828], "zoom": 16.0, "pitch": 65, "bearing": -30}}, {"name": "K1_07_Regensberg_Morgenlicht", "schritt": 5, "sat": false, "licht": "dawn", "cam": {"center": [8.4386, 47.4828], "zoom": 16.0, "pitch": 65, "bearing": -30}}, {"name": "K1_08_Regensberg_Siegfriedkarte", "schritt": 6}, {"name": "K1_09_Nachtlichter_Mitteleuropa", "schritt": 1}, {"name": "K1_10_Nachtlichter_Zuerich", "schritt": 2}, {"name": "K1_11_Statistische_Staedte_Schweiz", "schritt": 7, "cam": {"center": [8.23, 46.8], "zoom": 7.55, "pitch": 0, "bearing": 0}}, {"name": "K1_12_Historische_Staedtchen_Dufour", "schritt": 9}, {"name": "K1_13_Dichte_Kanton_Zuerich", "schritt": 10, "cam": {"center": [8.66, 47.42], "zoom": 9.6, "pitch": 0, "bearing": 0}}, {"name": "K1_14_Arbeitsplaetze_Kanton_Zuerich", "schritt": 12, "cam": {"center": [8.66, 47.42], "zoom": 9.6, "pitch": 0, "bearing": 0}}, {"name": "K1_15_Stadtzentrum_Zuerich_GHSL", "schritt": 14}, {"name": "K1_16_Perlflussdelta_1975_2025", "schritt": 15}, {"name": "K1_17_Perlflussdelta_Satellit_schraeg", "schritt": 15, "cam": {"center": [113.95, 22.42], "zoom": 9.6, "pitch": 62, "bearing": 330}, "nodelta": true}, {"name": "K1_18_Shenzhen_Abendlicht", "schritt": 15, "sat": false, "licht": "dusk", "cam": {"center": [114.057, 22.537], "zoom": 14.8, "pitch": 72, "bearing": 20}, "nodelta": true}];
let shotNr=-1;
function shot(i){const sh=SHOTS[i];['tafel','leiste'].forEach(id=>document.getElementById(id).style.display='none');
  geh(sh.schritt,true); if(sh.licht) map.setConfigProperty('basemap','lightPreset',sh.licht);
  if(sh.sat!==undefined) sicht('sat',sh.sat); if(sh.nodelta){['delta','uno','unotext'].forEach(l=>sicht(l,false))}
  if(drehAnim){cancelAnimationFrame(drehAnim);drehAnim=null}
  if(sh.cam) map.flyTo({...sh.cam,padding:{left:0,top:0,right:0,bottom:0},duration:2500});
  console.log('Shot',i+1,sh.name);}
addEventListener('keydown',e=>{if(e.key==='k'){shotNr=(shotNr+1)%SHOTS.length;shot(shotNr)} if(e.key==='Escape'){['tafel','leiste'].forEach(id=>document.getElementById(id).style.display='');geh(aktuell,true)}});

// Infofenster
const pop=new mapboxgl.Popup({closeButton:false,closeOnClick:false});
const NAMEN={d:['Einw. pro km²',''],ap:['Arbeitsplätze pro 100 Einw.',''],au:['Ausländer:innen',' %'],gh:['im Stadtzentrum',' %']};
map.on('mousemove','zh',e=>{const p=e.features[0].properties,f=map._zhf,k=NAMEN[f];
  map.getCanvas().style.cursor='pointer';
  pop.setLngLat(e.lngLat).setHTML(`<b>${p.n}</b><br>${k?k[0]+': '+(p[f]??'keine Angabe')+(p[f]!=null?k[1]:''):''}<br>statistische Stadt: ${p.st}`).addTo(map)});
map.on('mouseleave','zh',()=>{pop.remove();map.getCanvas().style.cursor=''});
map.on('mousemove','ch',e=>{if(!SCHRITTE[aktuell].ch)return;const p=e.features[0].properties;pop.setLngLat(e.lngLat).setHTML(`<b>${p.n}</b><br>${p.e?.toLocaleString('de-CH')} Einw.<br>${p.s?'statistische Stadt':'keine statistische Stadt'}`).addTo(map)});
map.on('mouseleave','ch',()=>pop.remove());
map.on('mousemove','hist',e=>{const p=e.features[0].properties;pop.setLngLat(e.lngLat).setHTML(`<b>${p.Ort}</b><br>${p.Recht_Gruendung}<br>${p.Heute}`).addTo(map)});
map.on('mouseleave','hist',()=>pop.remove());

// Kacheln der Stationen im Hintergrund laden (unsichtbare zweite Karte)
function vorladen(){
  const div=document.createElement('div');div.style.cssText='position:absolute;left:-3000px;top:0;width:1280px;height:800px;visibility:hidden';document.body.appendChild(div);
  const m2=new mapboxgl.Map({container:div,style:'mapbox://styles/mapbox/standard',interactive:false,center:[8.5,47.4],zoom:8});
  m2.on('style.load',()=>{m2.addSource('mapbox-dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});m2.setTerrain({source:'mapbox-dem',exaggeration:1.2});
    m2.addSource('sat',{type:'raster',url:'mapbox://mapbox.satellite',tileSize:256});m2.addLayer({id:'sat',type:'raster',source:'sat',slot:'middle'});
    let i=0;const naechste=()=>{if(i>=SCHRITTE.length){m2.remove();div.remove();return}m2.jumpTo(SCHRITTE[i++].cam);m2.once('idle',naechste)};naechste();});
}
